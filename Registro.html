<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Pochi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--lime:#94f8ad;--ink:#050705;--panel:#0a0e0a;--line:#eaffd21d;--muted:#c9d5c699}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -25%,#293b22 0,transparent 42%),var(--ink);color:#f3f8ef;font-family:"Space Grotesk",sans-serif}body:before{content:"";position:fixed;inset:0;z-index:-1;background-image:linear-gradient(#b5ef6809 1px,transparent 1px),linear-gradient(90deg,#b5ef6809 1px,transparent 1px);background-size:38px 38px;mask-image:linear-gradient(#000,transparent 82%)}.top{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(16px,5vw,70px);border-bottom:1px solid var(--line);background:#050705dc;backdrop-filter:blur(12px)}.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.8px}.mark{width:29px;height:29px;display:grid;place-items:center;border:1px solid #dfffa3;background:#b5ef6817;color:var(--lime);border-radius:8px;font:700 13px "JetBrains Mono"}.brand span{color:var(--lime)}.back{padding:8px 12px;border:1px solid #b5ef6852;border-radius:7px;color:#dff7cc;background:#b5ef680d;text-decoration:none;font:600 11px "JetBrains Mono"}main{width:min(1040px,calc(100% - 30px));margin:36px auto 50px}.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:17px}.eyebrow{color:var(--lime);font:700 10px "JetBrains Mono";letter-spacing:1.6px}.hero h1{margin:7px 0 0;font-size:clamp(27px,5vw,42px);letter-spacing:-1.8px}.hero p{margin:7px 0 0;color:var(--muted);font-size:13px}.stamp{padding:8px 10px;border:1px solid var(--line);border-radius:7px;color:var(--muted);font:10px "JetBrains Mono";white-space:nowrap}.panel{border:1px solid var(--line);border-radius:13px;background:linear-gradient(135deg,#0d120dd9,#060806e8);box-shadow:0 22px 70px #0007}.login{padding:25px;max-width:560px;margin:9vh auto}.panel-title{margin:0;color:var(--lime);font:700 11px "JetBrains Mono";letter-spacing:1.3px}.hint{margin:8px 0 19px;color:var(--muted);font-size:12px;line-height:1.5}.fields{display:grid;grid-template-columns:1fr 1fr auto;gap:8px}.fields input{min-width:0;padding:10px 11px;border:1px solid var(--line);border-radius:7px;background:#ffffff08;color:#fff;font:12px "JetBrains Mono"}.button{border:1px solid #d8ff9c;background:linear-gradient(135deg,#c7f67c,#749b40);color:#14220d;border-radius:7px;padding:10px 14px;font:700 11px "JetBrains Mono";cursor:pointer}.message{margin-top:13px;color:var(--muted);font:11px "JetBrains Mono"}.dashboard{display:none}.dashboard.show{display:block}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-bottom:14px}.metric{padding:15px;border:1px solid var(--line);border-radius:10px;background:#ffffff06}.metric small{display:block;color:var(--muted);font:10px "JetBrains Mono"}.metric strong{display:block;margin-top:6px;color:var(--lime);font:700 23px "JetBrains Mono"}.records{overflow:hidden}.records-head{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line)}.records-head span{color:var(--muted);font:10px "JetBrains Mono"}.entries{max-height:520px;overflow:auto}.entry{display:grid;grid-template-columns:150px 1.1fr minmax(180px,.8fr);gap:15px;padding:14px 18px;border-bottom:1px solid #ffffff0b;font:11px/1.55 "JetBrains Mono"}.entry:last-child{border-bottom:0}.entry b{color:#f4ffeb}.entry span{color:var(--muted)}.ip{color:var(--lime)}.empty{padding:30px 18px;color:var(--muted);font:12px "JetBrains Mono"}@media(max-width:650px){.top{height:58px}.hero{align-items:flex-start;flex-direction:column}.summary{grid-template-columns:1fr}.fields{grid-template-columns:1fr}.button{min-height:40px}.entry{grid-template-columns:1fr;gap:5px;padding:14px}.login{margin:5vh auto}.stamp{white-space:normal}}
  </style>
</head>
<body>
  <header class="top"><div class="brand"><div class="mark">P</div>Pochi<span></span></div><a class="back" href="./">← perfil</a></header>
  <main><section class="hero"><div><div class="eyebrow">PANEL PRIVADO</div><h1>registros de visitas</h1><p>Acceso personal · los datos no son públicos.</p></div><div class="stamp" id="clock">—</div></section>
    <section class="panel login" id="loginPanel"><h2 class="panel-title">ENTRAR AL PANEL</h2><p class="hint">Usa el correo y contraseña de administrador de tu proyecto.</p><form class="fields" id="login"><input id="email" type="email" placeholder="correo" required><input id="password" type="password" placeholder="contraseña" required><button class="button" type="submit">entrar</button></form><div class="message" id="status">Inicia sesión para ver los registros.</div></section>
    <section class="dashboard" id="dashboard"><div class="summary"><div class="metric"><small>VISITAS</small><strong id="total">—</strong></div><div class="metric"><small>HOY</small><strong id="today">—</strong></div><div class="metric"><small>ÚLTIMA VISITA</small><strong id="latest">—</strong></div></div><section class="panel records"><div class="records-head"><h2 class="panel-title">BITÁCORA DE ACCESOS</h2><span id="count">Cargando…</span></div><div class="entries" id="entries"></div></section></section>
  </main>
  <script src="app-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const cfg=window.APP_CONFIG||{},db=cfg.supabaseUrl&&cfg.supabaseKey?window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseKey):null,status=document.querySelector('#status'),entries=document.querySelector('#entries'),dashboard=document.querySelector('#dashboard');
    const esc=v=>{const e=document.createElement('span');e.textContent=v??'';return e.innerHTML};
    function tick(){document.querySelector('#clock').textContent=new Intl.DateTimeFormat('es',{dateStyle:'medium',timeStyle:'short'}).format(new Date())}tick();setInterval(tick,30000);
    async function load(){const {data,error}=await db.from('contact_submissions').select('full_name,public_ip,browser,operating_system,language,timezone,screen_resolution,referrer,created_at').order('created_at',{ascending:false}).limit(100);if(error){status.textContent='No se pudieron cargar los registros. Revisa los permisos de la base.';return}const now=new Date(),today=data.filter(x=>new Date(x.created_at).toDateString()===now.toDateString()).length;document.querySelector('#total').textContent=data.length;document.querySelector('#today').textContent=today;document.querySelector('#latest').textContent=data[0]?new Date(data[0].created_at).toLocaleDateString('es'):'—';document.querySelector('#count').textContent=`${data.length} registro(s)`;entries.innerHTML=data.length?data.map(x=>`<article class="entry"><div><b>${esc(x.full_name||'Visita de perfil')}</b><br><span>${new Date(x.created_at).toLocaleString('es')}</span></div><div><b class="ip">${esc(x.public_ip||'IP no disponible')}</b><br><span>${esc(x.browser||'Navegador desconocido')} · ${esc(x.operating_system||'')} · ${esc(x.screen_resolution||'')}</span></div><div><span>${esc(x.timezone||'Sin zona horaria')}<br>${esc(x.referrer||'Entrada directa')}</span></div></article>`).join(''):'<div class="empty">Todavía no hay visitas guardadas.</div>';dashboard.classList.add('show')}
    if(!db){status.textContent='Falta configurar app-config.js.';document.querySelector('#login').style.display='none'}else{db.auth.getSession().then(({data})=>{if(data.session){document.querySelector('#loginPanel').style.display='none';load()}})}
    document.querySelector('#login').addEventListener('submit',async e=>{e.preventDefault();status.textContent='Entrando…';const {error}=await db.auth.signInWithPassword({email:email.value,password:password.value});if(error){status.textContent='Correo o contraseña incorrectos.';return}document.querySelector('#loginPanel').style.display='none';load()});
  </script>
</body>
</html>
